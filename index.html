<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Harley-Davidson Eyewear Locations</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("hd-eyewear-theme"); } catch (e) {}
      var theme = saved === "light" || saved === "dark"
        ? saved
        : (window.matchMedia("(max-width: 800px)").matches ? "light" : "dark");
      document.documentElement.classList.add("theme-" + theme);
    })();
  </script>
</head>
<body>
  <div class="app">
    <main class="map-pane">
      <div id="map" role="application" aria-label="Store location map"></div>
      <button type="button" class="finder-open" id="finder-open" hidden>Find a location</button>
    </main>
    <aside class="sidebar" id="sidebar">
      <div class="sheet-handle" id="sheet-handle" aria-hidden="true"></div>
      <header class="sidebar-header">
        <div class="header-top">
          <p class="eyebrow">Harley-Davidson Eyewear</p>
          <div class="header-tools">
            <button type="button" class="daylight-toggle" id="daylight-toggle" aria-pressed="false">
              <span class="switch" aria-hidden="true"><span class="knob"></span></span>
              Daylight
            </button>
            <button type="button" class="settings-btn" id="settings-btn" aria-expanded="false" aria-controls="settings-panel" aria-label="Settings">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="currentColor" d="M19.14 12.94a7.6 7.6 0 0 0 .05-.94 7.6 7.6 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.13.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64L4.86 10.7a7.6 7.6 0 0 0-.05.94 7.6 7.6 0 0 0 .05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.8a.5.5 0 0 0 .49-.42l.36-2.54c.58-.23 1.13-.54 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="settings-panel" id="settings-panel" hidden>
          <p class="settings-title">Settings</p>
          <button type="button" class="daylight-toggle in-settings" id="daylight-toggle-mobile" aria-pressed="false">
            <span class="switch" aria-hidden="true"><span class="knob"></span></span>
            Daylight map
          </button>
        </div>
        <h1>Find a location</h1>
        <p class="count" id="count-label">64 locations</p>
      </header>

      <div class="locate-bar" id="locate-bar">
        <p class="locate-status" id="locate-status">Allow to find a store near you.</p>
        <div class="locate-place">
          <button type="button" class="locate-btn" id="locate-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="locate-menu">Use my location</button>
          <div class="locate-menu" id="locate-menu" role="menu" hidden>
            <button type="button" role="menuitem" data-locate-action="refresh">Update location</button>
            <button type="button" role="menuitem" data-locate-action="stop">Stop sharing</button>
          </div>
        </div>
      </div>

      <form class="search-form" id="search-form">
        <label class="search-wrap">
          <span class="sr-only">Your address or city</span>
          <input type="search" id="search" placeholder="Address or city" autocomplete="street-address" enterkeyhint="search">
        </label>
      </form>
      <p class="search-status" id="search-status" hidden></p>

      <div class="filters" id="filters" role="group" aria-label="Filter by state">
        <button type="button" class="filter-btn is-active" data-state="ALL">All</button>
        <button type="button" class="filter-btn" data-state="MD">MD</button>
        <button type="button" class="filter-btn" data-state="DE">DE</button>
        <button type="button" class="filter-btn" data-state="VA">VA</button>
        <button type="button" class="filter-btn" data-state="WV">WV</button>
      </div>

      <ul class="location-list" id="location-list"></ul>
      <p class="empty" id="empty-state" hidden>No locations match that search.</p>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
