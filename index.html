<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 2rem;
      text-align: center;
      z-index: 10;
    }

    header h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #three-canvas {
      width: min(90vw, 90vh, 800px);
      height: min(90vw, 90vh, 800px);
      max-width: 100%;
      max-height: 70vh;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
      z-index: 10;
    }

    @media (max-width: 480px) {
      header {
        padding: 1rem;
      }

      #three-canvas {
        width: 95vw;
        height: 60vh;
        border-radius: 0.75rem;
      }

      footer {
        padding: 0.75rem 1rem;
        font-size: 0.75rem;
      }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      #three-canvas {
        width: 85vw;
        height: 65vh;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      #three-canvas {
        width: 70vw;
        height: 70vh;
      }
    }

    @media (min-width: 1025px) {
      #three-canvas {
        width: min(60vw, 800px);
        height: min(70vh, 800px);
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      header h1 {
        font-size: 1.25rem;
      }

      header {
        padding: 0.5rem 1rem;
      }

      #three-canvas {
        width: 50vw;
        height: 80vh;
      }

      footer {
        display: none;
      }
    }

    /* === BRAND SIDE MENUS === */
    .brand-side-menu {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 20;
    }

    .brand-side-menu.left {
      left: 1.5rem;
    }

    .brand-side-menu.right {
      right: 1.5rem;
    }

    .brand-side-btn {
      padding: 0.75rem 1.25rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 0.5rem;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .brand-side-btn:hover {
      background: rgba(233, 69, 96, 0.3);
      border-color: #e94560;
      transform: scale(1.05);
    }

    .brand-side-menu.left .brand-side-btn {
      text-align: left;
    }

    .brand-side-menu.right .brand-side-btn {
      text-align: right;
    }

    @media (max-width: 900px) {
      .brand-side-menu {
        gap: 0.5rem;
      }

      .brand-side-btn {
        padding: 0.5rem 0.75rem;
        font-size: 0.7rem;
      }
    }

    @media (max-width: 600px) {
      .brand-side-menu.left {
        left: 0.5rem;
      }

      .brand-side-menu.right {
        right: 0.5rem;
      }

      .brand-side-btn {
        padding: 0.4rem 0.6rem;
        font-size: 0.65rem;
      }
    }
    /* === END BRAND SIDE MENUS === */

    /* === ROTATION MENU (hidden) === */
    #brand-menu {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      display: none; /* HIDDEN - change to flex to show */
      flex-direction: column;
      gap: 0.5rem;
      z-index: 20;
      max-height: 70vh;
      overflow-y: auto;
    }

    .brand-btn {
      padding: 0.6rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.5rem;
      color: #fff;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .brand-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .brand-btn.active {
      background: rgba(233, 69, 96, 0.4);
      border-color: #e94560;
    }

    .brand-btn.save-btn {
      background: rgba(78, 205, 196, 0.2);
      border-color: #4ecdc4;
    }

    .brand-btn.save-btn:hover {
      background: rgba(78, 205, 196, 0.4);
    }

    .brand-btn.delete-btn {
      background: rgba(255, 100, 100, 0.2);
      border-color: #ff6464;
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
    }

    .brand-item {
      display: flex;
      gap: 0.25rem;
      align-items: center;
    }

    .rotation-sliders {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.75rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .slider-row label {
      font-size: 0.75rem;
      width: 1.5rem;
      font-weight: 600;
    }

    .slider-row input[type="range"] {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      cursor: pointer;
    }

    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #e94560;
      border-radius: 50%;
      cursor: pointer;
    }

    .slider-row .value {
      font-size: 0.7rem;
      width: 3rem;
      text-align: right;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      #brand-menu {
        right: 0.5rem;
        max-height: 50vh;
      }

      .brand-btn {
        padding: 0.5rem 0.75rem;
        font-size: 0.75rem;
      }
    }
    /* === END BRAND MENU === */
  </style>
</head>
<body>
  <header>
    <h1>World Cup</h1>
  </header>

  <div id="canvas-container">
    <canvas id="three-canvas"></canvas>
  </div>

  <!-- === BRAND SIDE MENUS === -->
  <div class="brand-side-menu left">
    <button class="brand-side-btn" data-brand="0">Hollister</button>
    <button class="brand-side-btn" data-brand="1">Harley Davidson</button>
    <button class="brand-side-btn" data-brand="2">Timberland</button>
    <button class="brand-side-btn" data-brand="3">Gant</button>
  </div>
  <div class="brand-side-menu right">
    <button class="brand-side-btn" data-brand="4">Adidas Original</button>
    <button class="brand-side-btn" data-brand="5">Skechers</button>
    <button class="brand-side-btn" data-brand="6">Adidas Sport</button>
    <button class="brand-side-btn" data-brand="7">Marcolin</button>
  </div>
  <!-- === END BRAND SIDE MENUS === -->

  <!-- === ROTATION MENU (hidden) === -->
  <div id="brand-menu">
    <div class="rotation-sliders">
      <div class="slider-row">
        <label>X</label>
        <input type="range" id="slider-x" min="-3.14159" max="3.14159" step="0.01" value="0">
        <span class="value" id="value-x">0°</span>
      </div>
      <div class="slider-row">
        <label>Y</label>
        <input type="range" id="slider-y" min="-3.14159" max="3.14159" step="0.01" value="0">
        <span class="value" id="value-y">0°</span>
      </div>
      <div class="slider-row">
        <label>Z</label>
        <input type="range" id="slider-z" min="-3.14159" max="3.14159" step="0.01" value="0">
        <span class="value" id="value-z">0°</span>
      </div>
    </div>
    <button class="brand-btn save-btn" id="save-brand-btn">+ Save Position</button>
    <div id="brand-list"></div>
  </div>
  <!-- === END BRAND MENU === -->

  <footer>
    <p>&copy; 2026 World Cup</p>
  </footer>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('three-canvas');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(
      75,
      canvas.clientWidth / canvas.clientHeight,
      0.1,
      1000
    );
    camera.position.z = 3;

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true
    });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    let pivot = null;
    let autoRotate = true;

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.saveState();

    let resumeTimeout = null;

    controls.addEventListener('start', () => {
      autoRotate = false;
      if (resumeTimeout) {
        clearTimeout(resumeTimeout);
        resumeTimeout = null;
      }
    });

    controls.addEventListener('end', () => {
      resumeTimeout = setTimeout(() => {
        autoRotate = true;
      }, 2000);
    });

    const loader = new GLTFLoader();
    loader.load(
      'ball.glb',
      (gltf) => {
        const model = gltf.scene;
        
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 4 / maxDim;
        
        model.traverse((child) => {
          if (child.isMesh) {
            child.geometry.computeBoundingBox();
          }
        });
        
        pivot = new THREE.Group();
        scene.add(pivot);
        
        const inner = new THREE.Group();
        inner.position.set(-center.x, -center.y, -center.z);
        inner.add(model);
        
        pivot.add(inner);
        pivot.scale.setScalar(scale);
      },
      (progress) => {
        console.log('Loading:', (progress.loaded / progress.total * 100) + '%');
      },
      (error) => {
        console.error('Error loading model:', error);
      }
    );

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);

    const pointLight = new THREE.PointLight(0xff6b6b, 0.8);
    pointLight.position.set(-5, 3, 5);
    scene.add(pointLight);

    const pointLight2 = new THREE.PointLight(0x4ecdc4, 0.5);
    pointLight2.position.set(5, -3, 5);
    scene.add(pointLight2);

    function handleResize() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    window.addEventListener('resize', handleResize);

    /* === BRAND ROTATION DATA === */
    const brandRotations = [
      { name: "Hollister", x: -0.52159, y: -0.44159, z: -0.66159 },
      { name: "Harley Davidson", x: -0.99159, y: 1.33841, z: -1.46159 },
      { name: "Timberland", x: -1.65159, y: 0.06841, z: -1.76159 },
      { name: "Gant", x: 0.67841, y: -2.12159, z: -0.88159 },
      { name: "Adidas Original", x: -0.41159, y: -2.41159, z: -0.88159 },
      { name: "Skechers", x: 0.27841, y: 2.97841, z: -0.74159 },
      { name: "Adidas Sport", x: -0.92159, y: 0.38841, z: 1.18841 },
      { name: "Marcolin", x: 0.42841, y: -0.23159, z: -0.81159 }
    ];
    /* === END BRAND ROTATION DATA === */

    let isAnimatingToTarget = false;
    let targetRotation = null;

    function saveBrandPosition() {
      if (!pivot) return;
      const name = prompt('Enter brand name:');
      if (!name) return;

      brandRotations.push({
        name: name,
        x: pivot.rotation.x,
        y: pivot.rotation.y,
        z: pivot.rotation.z
      });

      renderBrandList();
      console.log('Brand rotations:', JSON.stringify(brandRotations, null, 2));
    }

    function animateToRotation(target) {
      autoRotate = false;
      if (resumeTimeout) {
        clearTimeout(resumeTimeout);
        resumeTimeout = null;
      }
      
      // Reset camera to default position for consistent brand views
      controls.reset();
      
      targetRotation = target;
      isAnimatingToTarget = true;
    }

    function deleteBrand(index) {
      brandRotations.splice(index, 1);
      renderBrandList();
    }

    function renderBrandList() {
      const list = document.getElementById('brand-list');
      list.innerHTML = brandRotations.map((brand, i) => `
        <div class="brand-item">
          <button class="brand-btn" onclick="window.selectBrand(${i})">${brand.name}</button>
          <button class="brand-btn delete-btn" onclick="window.deleteBrand(${i})">X</button>
        </div>
      `).join('');
    }

    window.selectBrand = (index) => {
      const brand = brandRotations[index];
      if (brand) animateToRotation({ x: brand.x, y: brand.y, z: brand.z });
    };
    window.deleteBrand = deleteBrand;

    document.getElementById('save-brand-btn').addEventListener('click', saveBrandPosition);
    renderBrandList();

    document.querySelectorAll('.brand-side-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const index = parseInt(btn.dataset.brand);
        const brand = brandRotations[index];
        if (brand) animateToRotation({ x: brand.x, y: brand.y, z: brand.z });
      });
    });

    const sliderX = document.getElementById('slider-x');
    const sliderY = document.getElementById('slider-y');
    const sliderZ = document.getElementById('slider-z');
    const valueX = document.getElementById('value-x');
    const valueY = document.getElementById('value-y');
    const valueZ = document.getElementById('value-z');

    function toDegrees(rad) {
      return Math.round(rad * 180 / Math.PI) + '°';
    }

    function onSliderChange() {
      if (!pivot) return;
      autoRotate = false;
      isAnimatingToTarget = false;
      if (resumeTimeout) {
        clearTimeout(resumeTimeout);
        resumeTimeout = null;
      }
      pivot.rotation.x = parseFloat(sliderX.value);
      pivot.rotation.y = parseFloat(sliderY.value);
      pivot.rotation.z = parseFloat(sliderZ.value);
      valueX.textContent = toDegrees(pivot.rotation.x);
      valueY.textContent = toDegrees(pivot.rotation.y);
      valueZ.textContent = toDegrees(pivot.rotation.z);
    }

    function updateSliders() {
      if (!pivot) return;
      sliderX.value = pivot.rotation.x;
      sliderY.value = pivot.rotation.y;
      sliderZ.value = pivot.rotation.z;
      valueX.textContent = toDegrees(pivot.rotation.x);
      valueY.textContent = toDegrees(pivot.rotation.y);
      valueZ.textContent = toDegrees(pivot.rotation.z);
    }

    sliderX.addEventListener('input', onSliderChange);
    sliderY.addEventListener('input', onSliderChange);
    sliderZ.addEventListener('input', onSliderChange);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (pivot && isAnimatingToTarget && targetRotation) {
        const speed = 0.05;
        pivot.rotation.x += (targetRotation.x - pivot.rotation.x) * speed;
        pivot.rotation.y += (targetRotation.y - pivot.rotation.y) * speed;
        pivot.rotation.z += (targetRotation.z - pivot.rotation.z) * speed;

        const dx = Math.abs(targetRotation.x - pivot.rotation.x);
        const dy = Math.abs(targetRotation.y - pivot.rotation.y);
        const dz = Math.abs(targetRotation.z - pivot.rotation.z);
        if (dx < 0.001 && dy < 0.001 && dz < 0.001) {
          isAnimatingToTarget = false;
          targetRotation = null;
        }
      } else if (pivot && autoRotate) {
        pivot.rotation.x += 0.003;
        pivot.rotation.y += 0.007;
        pivot.rotation.z += 0.002;
      }

      updateSliders();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
