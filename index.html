<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 2rem;
      text-align: center;
      z-index: 10;
    }

    header h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #three-canvas {
      width: min(90vw, 90vh, 800px);
      height: min(90vw, 90vh, 800px);
      max-width: 100%;
      max-height: 70vh;
    }

    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
      z-index: 10;
    }

    @media (max-width: 480px) {
      header {
        padding: 1rem;
      }

      #three-canvas {
        width: 95vw;
        height: 60vh;
      }

      footer {
        padding: 0.75rem 1rem;
        font-size: 0.75rem;
      }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      #three-canvas {
        width: 85vw;
        height: 65vh;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      #three-canvas {
        width: 70vw;
        height: 70vh;
      }
    }

    @media (min-width: 1025px) {
      #three-canvas {
        width: min(60vw, 800px);
        height: min(70vh, 800px);
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      header h1 {
        font-size: 1.25rem;
      }

      header {
        padding: 0.5rem 1rem;
      }

      #three-canvas {
        width: 50vw;
        height: 80vh;
      }

      footer {
        display: none;
      }
    }

    /* === BRAND SIDE MENUS === */
    .brand-side-menu {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 20;
    }

    .brand-side-menu.left {
      left: 2rem;
    }

    .brand-side-menu.right {
      right: 2rem;
    }

    .brand-side-btn {
      padding: 0.6rem 1rem;
      background: transparent;
      border: none;
      border-left: 2px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .brand-side-menu.right .brand-side-btn {
      border-left: none;
      border-right: 2px solid rgba(255, 255, 255, 0.2);
    }

    .brand-side-btn:hover {
      color: #fff;
      border-color: #e94560;
      padding-left: 1.25rem;
    }

    .brand-side-menu.right .brand-side-btn:hover {
      padding-left: 1rem;
      padding-right: 1.25rem;
    }

    .brand-side-menu.left .brand-side-btn {
      text-align: left;
    }

    .brand-side-menu.right .brand-side-btn {
      text-align: right;
    }

    @media (max-width: 900px) {
      .brand-side-menu {
        gap: 0.4rem;
      }

      .brand-side-menu.left {
        left: 1rem;
      }

      .brand-side-menu.right {
        right: 1rem;
      }

      .brand-side-btn {
        padding: 0.4rem 0.75rem;
        font-size: 0.65rem;
      }
    }

    @media (max-width: 600px) {
      .brand-side-menu.left {
        left: 0.5rem;
      }

      .brand-side-menu.right {
        right: 0.5rem;
      }

      .brand-side-btn {
        padding: 0.35rem 0.5rem;
        font-size: 0.6rem;
        letter-spacing: 0.04em;
      }
    }
    /* === END BRAND SIDE MENUS === */

    /* === ROTATION MENU (hidden) === */
    #brand-menu {
      position: absolute;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      display: none; /* HIDDEN - change to flex to show */
      flex-direction: row;
      align-items: center;
      gap: 1rem;
      z-index: 20;
      padding: 1rem 1.5rem;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-btn {
      padding: 0.6rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.5rem;
      color: #fff;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .brand-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .brand-btn.active {
      background: rgba(78, 205, 196, 0.4);
      border-color: #4ecdc4;
      box-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
    }

    .brand-btn.save-btn {
      background: rgba(78, 205, 196, 0.2);
      border-color: #4ecdc4;
    }

    .brand-btn.save-btn:hover {
      background: rgba(78, 205, 196, 0.4);
    }

    .brand-btn.delete-btn {
      background: rgba(255, 100, 100, 0.2);
      border-color: #ff6464;
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
    }

    .brand-item {
      display: flex;
      gap: 0.25rem;
      align-items: center;
    }

    .rotation-sliders {
      display: flex;
      flex-direction: row;
      gap: 1rem;
      padding: 0;
      background: transparent;
      border-radius: 0;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .slider-row label {
      font-size: 0.75rem;
      width: 1rem;
      font-weight: 600;
      color: #e94560;
    }

    .slider-row input[type="range"] {
      width: 80px;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      cursor: pointer;
    }

    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #e94560;
      border-radius: 50%;
      cursor: pointer;
    }

    .slider-row .value {
      font-size: 0.7rem;
      width: 2.5rem;
      text-align: right;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      #brand-menu {
        bottom: 2rem;
        padding: 0.75rem 1rem;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 95vw;
      }

      .rotation-sliders {
        flex-direction: column;
        gap: 0.5rem;
      }

      .slider-row input[type="range"] {
        width: 60px;
      }

      .brand-btn {
        padding: 0.5rem 0.75rem;
        font-size: 0.75rem;
      }
    }
    /* === END BRAND MENU === */

    /* === REGION HIGHLIGHT INFO === */
    #highlight-info {
      position: absolute;
      top: 5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(78, 205, 196, 0.5);
      border-radius: 0.75rem;
      padding: 0.75rem 1.25rem;
      z-index: 25;
      font-size: 0.8rem;
      color: #fff;
      display: none;
    }

    #highlight-info.visible {
      display: block;
    }

    #highlight-info .info-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.25rem;
    }

    #highlight-info .info-row:last-child {
      margin-bottom: 0;
    }

    #highlight-info .label {
      color: #4ecdc4;
      font-weight: 600;
      min-width: 3rem;
    }

    #highlight-info .value {
      font-family: monospace;
    }

    #region-size-slider {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      cursor: pointer;
      margin: 0 0.5rem;
    }

    #region-size-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: #4ecdc4;
      border-radius: 50%;
      cursor: pointer;
    }

    #save-region-btn {
      margin-top: 0.5rem;
      width: 100%;
      padding: 0.5rem;
      background: rgba(78, 205, 196, 0.2);
      border: 1px solid #4ecdc4;
      border-radius: 0.5rem;
      color: #fff;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #save-region-btn:hover {
      background: rgba(78, 205, 196, 0.4);
    }

    #uv-preview {
      margin-top: 0.75rem;
      width: 150px;
      height: 150px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(78, 205, 196, 0.3);
      border-radius: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    #uv-preview-label {
      position: absolute;
      top: 0.25rem;
      left: 0.25rem;
      font-size: 0.6rem;
      color: rgba(255, 255, 255, 0.5);
    }

    #uv-marker {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #4ecdc4;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px #4ecdc4;
      pointer-events: none;
    }

    #uv-grid {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 25% 25%;
    }

    #uv-axes {
      position: absolute;
      bottom: 0.25rem;
      right: 0.25rem;
      font-size: 0.55rem;
      color: rgba(255, 255, 255, 0.4);
    }
    /* === END REGION HIGHLIGHT INFO === */

    /* === BRAND POPUP === */
    #brand-popup {
      position: absolute;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      border: 2px solid #e94560;
      border-radius: 1rem;
      padding: 1rem 1.5rem;
      z-index: 100;
      display: none;
      transform: translate(-50%, -100%);
      margin-top: -15px;
      min-width: 120px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(233, 69, 96, 0.3);
      animation: popupIn 0.2s ease-out;
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: translate(-50%, -80%) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -100%) scale(1);
      }
    }

    #brand-popup.visible {
      display: block;
    }

    #brand-popup .brand-name {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #brand-popup .brand-action-btn {
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, #e94560, #ff6b6b);
      border: none;
      border-radius: 0.5rem;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    #brand-popup .brand-action-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
    }

    #brand-popup::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 10px solid #e94560;
    }
    /* === END BRAND POPUP === */
  </style>
</head>
<body>
  <header>
    <h1>World Cup</h1>
  </header>

  <div id="canvas-container">
    <canvas id="three-canvas"></canvas>
  </div>

  <!-- === BRAND POPUP === -->
  <div id="brand-popup">
    <div class="brand-name" id="popup-brand-name">Brand</div>
    <button class="brand-action-btn" id="popup-action-btn">View Brand</button>
  </div>
  <!-- === END BRAND POPUP === -->

  <!-- === REGION HIGHLIGHT INFO === -->
  <div id="highlight-info">
    <div class="info-row">
      <span class="label">3D:</span>
      <span class="value" id="info-3d">x: 0, y: 0, z: 0</span>
    </div>
    <div class="info-row">
      <span class="label">UV:</span>
      <span class="value" id="info-uv">u: 0, v: 0</span>
    </div>
    <div class="info-row">
      <span class="label">Normal:</span>
      <span class="value" id="info-normal">x: 0, y: 0, z: 0</span>
    </div>
    <div class="info-row" style="margin-top: 0.5rem;">
      <span class="label">Size:</span>
      <input type="range" id="region-size-slider" min="0.02" max="0.5" step="0.01" value="0.1">
      <span class="value" id="region-size-value">0.10</span>
    </div>
    <div id="uv-preview">
      <span id="uv-preview-label">UV Map</span>
      <div id="uv-grid"></div>
      <div id="uv-marker"></div>
      <span id="uv-axes">U → / V ↑</span>
    </div>
    <button id="save-region-btn">Save This Region</button>
  </div>
  <!-- === END REGION HIGHLIGHT INFO === -->

  <!-- === BRAND SIDE MENUS === -->
  <div class="brand-side-menu left">
    <button class="brand-side-btn" data-brand="0">Hollister</button>
    <button class="brand-side-btn" data-brand="1">Harley Davidson</button>
    <button class="brand-side-btn" data-brand="2">Timberland</button>
    <button class="brand-side-btn" data-brand="3">Gant</button>
  </div>
  <div class="brand-side-menu right">
    <button class="brand-side-btn" data-brand="4">Adidas Originals</button>
    <button class="brand-side-btn" data-brand="5">Skechers</button>
    <button class="brand-side-btn" data-brand="6">Adidas Sport</button>
    <button class="brand-side-btn" data-brand="7">Marcolin</button>
  </div>
  <!-- === END BRAND SIDE MENUS === -->

  <!-- === MAPPING MENU (hidden) === -->
  <div id="brand-menu">
    <button class="brand-btn" id="toggle-autorotate-btn">Stop Rotation</button>
    <button class="brand-btn" id="toggle-mapping-btn">Enable Mapping</button>
    <div class="rotation-sliders">
      <div class="slider-row">
        <label>X</label>
        <input type="range" id="slider-x" min="-3.14159" max="3.14159" step="0.01" value="0">
        <span class="value" id="value-x">0°</span>
      </div>
      <div class="slider-row">
        <label>Y</label>
        <input type="range" id="slider-y" min="-3.14159" max="3.14159" step="0.01" value="0">
        <span class="value" id="value-y">0°</span>
      </div>
      <div class="slider-row">
        <label>Z</label>
        <input type="range" id="slider-z" min="-3.14159" max="3.14159" step="0.01" value="0">
        <span class="value" id="value-z">0°</span>
      </div>
    </div>
    <button class="brand-btn save-btn" id="save-brand-btn">+ Save Rotation</button>
    <div id="brand-list" style="display: none;"></div>
  </div>
  <!-- === END MAPPING MENU (hidden) === -->

  <footer>
    <p>&copy; 2026 World Cup</p>
  </footer>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('three-canvas');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(
      75,
      canvas.clientWidth / canvas.clientHeight,
      0.1,
      1000
    );
    camera.position.z = 3;

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true
    });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    let pivot = null;
    let autoRotate = true;
    let autoRotateEnabled = true; // User preference for auto-rotation

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.saveState();

    let resumeTimeout = null;

    controls.addEventListener('start', () => {
      autoRotate = false;
      if (resumeTimeout) {
        clearTimeout(resumeTimeout);
        resumeTimeout = null;
      }
    });

    controls.addEventListener('end', () => {
      if (autoRotateEnabled) {
        resumeTimeout = setTimeout(() => {
          autoRotate = true;
        }, 2000);
      }
    });

    const loader = new GLTFLoader();
    loader.load(
      'ball.glb',
      (gltf) => {
        const model = gltf.scene;
        
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 4 / maxDim;
        
        model.traverse((child) => {
          if (child.isMesh) {
            child.geometry.computeBoundingBox();
          }
        });
        
        pivot = new THREE.Group();
        scene.add(pivot);
        
        const inner = new THREE.Group();
        inner.position.set(-center.x, -center.y, -center.z);
        inner.add(model);
        
        pivot.add(inner);
        pivot.scale.setScalar(scale);
      },
      (progress) => {
        console.log('Loading:', (progress.loaded / progress.total * 100) + '%');
      },
      (error) => {
        console.error('Error loading model:', error);
      }
    );

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);

    const pointLight = new THREE.PointLight(0xff6b6b, 0.8);
    pointLight.position.set(-5, 3, 5);
    scene.add(pointLight);

    const pointLight2 = new THREE.PointLight(0x4ecdc4, 0.5);
    pointLight2.position.set(5, -3, 5);
    scene.add(pointLight2);

    function handleResize() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    window.addEventListener('resize', handleResize);

    /* === RAYCASTING & REGION HIGHLIGHTING === */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    
    // Highlight ring to show selected region
    let regionSize = 0.1;
    let highlightGeometry = new THREE.RingGeometry(regionSize * 0.8, regionSize, 32);
    const highlightMaterial = new THREE.MeshBasicMaterial({
      color: 0x4ecdc4,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.8,
      depthTest: false
    });
    const highlightRing = new THREE.Mesh(highlightGeometry, highlightMaterial);
    highlightRing.visible = false;
    scene.add(highlightRing);
    
    function updateHighlightRingSize(size) {
      regionSize = size;
      highlightRing.geometry.dispose();
      highlightRing.geometry = new THREE.RingGeometry(size * 0.8, size, 32);
    }
    
    let currentHighlight = null;
    let mappingMode = false;
    const savedRegions = [];
    
    const highlightInfo = document.getElementById('highlight-info');
    const info3D = document.getElementById('info-3d');
    const infoUV = document.getElementById('info-uv');
    const infoNormal = document.getElementById('info-normal');
    const uvMarker = document.getElementById('uv-marker');
    const uvPreview = document.getElementById('uv-preview');
    
    function updateHighlightInfo(intersection) {
      if (!intersection) {
        highlightInfo.classList.remove('visible');
        return;
      }
      
      highlightInfo.classList.add('visible');
      
      const point = intersection.point;
      const normal = intersection.face ? intersection.face.normal.clone() : new THREE.Vector3(0, 0, 1);
      const uv = intersection.uv || { x: 0, y: 0 };
      
      info3D.textContent = `x: ${point.x.toFixed(3)}, y: ${point.y.toFixed(3)}, z: ${point.z.toFixed(3)}`;
      infoUV.textContent = `u: ${uv.x.toFixed(3)}, v: ${uv.y.toFixed(3)}`;
      infoNormal.textContent = `x: ${normal.x.toFixed(3)}, y: ${normal.y.toFixed(3)}, z: ${normal.z.toFixed(3)}`;
      
      // Update UV preview marker position
      const previewWidth = uvPreview.offsetWidth;
      const previewHeight = uvPreview.offsetHeight;
      uvMarker.style.left = `${uv.x * previewWidth}px`;
      uvMarker.style.top = `${(1 - uv.y) * previewHeight}px`;
      
      currentHighlight = {
        point: point.clone(),
        normal: normal.clone(),
        uv: { u: uv.x, v: uv.y }
      };
    }
    
    function positionHighlightRing(intersection) {
      if (!intersection || !intersection.face) {
        highlightRing.visible = false;
        return;
      }
      
      highlightRing.visible = true;
      highlightRing.position.copy(intersection.point);
      
      // Orient ring to face normal
      const normal = intersection.face.normal.clone();
      // Transform normal by object's world matrix rotation
      const normalMatrix = new THREE.Matrix3().getNormalMatrix(intersection.object.matrixWorld);
      normal.applyMatrix3(normalMatrix).normalize();
      
      // Offset slightly along normal to prevent z-fighting
      highlightRing.position.addScaledVector(normal, 0.01);
      
      // Make ring face outward along normal
      highlightRing.lookAt(highlightRing.position.clone().add(normal));
    }
    
    // Brand popup elements
    const brandPopup = document.getElementById('brand-popup');
    const popupBrandName = document.getElementById('popup-brand-name');
    const popupActionBtn = document.getElementById('popup-action-btn');
    let currentPopupBrand = null;
    
    function findBrandAtUV(uv) {
      if (!uv) return null;
      
      for (let i = 0; i < brandRegions.length; i++) {
        const brand = brandRegions[i];
        const du = uv.x - brand.uv.u;
        const dv = uv.y - brand.uv.v;
        const distance = Math.sqrt(du * du + dv * dv);
        
        // Check if within brand's region (using UV distance threshold based on size)
        const threshold = brand.size * 0.1;
        if (distance < threshold) {
          return { brand, index: i };
        }
      }
      return null;
    }
    
    function showBrandPopup(brand, screenX, screenY) {
      popupBrandName.textContent = brand.name;
      brandPopup.style.left = `${screenX}px`;
      brandPopup.style.top = `${screenY}px`;
      brandPopup.classList.add('visible');
      currentPopupBrand = brand;
    }
    
    function hideBrandPopup() {
      brandPopup.classList.remove('visible');
      currentPopupBrand = null;
    }
    
    popupActionBtn.addEventListener('click', () => {
      if (currentPopupBrand) {
        alert(`You clicked on ${currentPopupBrand.name}!`);
        hideBrandPopup();
      }
    });
    
    // Hide popup when clicking elsewhere
    document.addEventListener('click', (event) => {
      if (!brandPopup.contains(event.target) && event.target !== canvas) {
        hideBrandPopup();
      }
    });
    
    function onCanvasClick(event) {
      if (!pivot) return;
      
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      
      // Get all meshes from the pivot
      const meshes = [];
      pivot.traverse((child) => {
        if (child.isMesh) meshes.push(child);
      });
      
      const intersects = raycaster.intersectObjects(meshes, false);
      
      if (intersects.length > 0) {
        const intersection = intersects[0];
        
        // Check if clicked on a brand region
        if (!mappingMode) {
          const brandHit = findBrandAtUV(intersection.uv);
          if (brandHit) {
            showBrandPopup(brandHit.brand, event.clientX, event.clientY);
            return;
          } else {
            hideBrandPopup();
          }
        }
        
        // Mapping mode - show highlight ring and info
        if (mappingMode) {
          positionHighlightRing(intersection);
          updateHighlightInfo(intersection);
        }
      }
    }
    
    canvas.addEventListener('click', onCanvasClick);
    
    const toggleAutorotateBtn = document.getElementById('toggle-autorotate-btn');
    toggleAutorotateBtn.addEventListener('click', () => {
      autoRotateEnabled = !autoRotateEnabled;
      autoRotate = autoRotateEnabled;
      toggleAutorotateBtn.textContent = autoRotateEnabled ? 'Stop Rotation' : 'Start Rotation';
      toggleAutorotateBtn.classList.toggle('active', !autoRotateEnabled);
      
      if (resumeTimeout) {
        clearTimeout(resumeTimeout);
        resumeTimeout = null;
      }
    });
    
    const toggleMappingBtn = document.getElementById('toggle-mapping-btn');
    toggleMappingBtn.addEventListener('click', () => {
      mappingMode = !mappingMode;
      toggleMappingBtn.textContent = mappingMode ? 'Disable Mapping' : 'Enable Mapping';
      toggleMappingBtn.classList.toggle('active', mappingMode);
      
      if (mappingMode) {
        autoRotate = false;
        autoRotateEnabled = false;
        toggleAutorotateBtn.textContent = 'Start Rotation';
        toggleAutorotateBtn.classList.add('active');
        if (resumeTimeout) {
          clearTimeout(resumeTimeout);
          resumeTimeout = null;
        }
      }
      
      if (!mappingMode) {
        highlightRing.visible = false;
        highlightInfo.classList.remove('visible');
        currentHighlight = null;
      }
    });
    
    const regionSizeSlider = document.getElementById('region-size-slider');
    const regionSizeValue = document.getElementById('region-size-value');
    
    regionSizeSlider.addEventListener('input', () => {
      const size = parseFloat(regionSizeSlider.value);
      updateHighlightRingSize(size);
      regionSizeValue.textContent = size.toFixed(2);
    });
    
    document.getElementById('save-region-btn').addEventListener('click', () => {
      if (!currentHighlight || !pivot) return;
      
      const name = prompt('Enter brand/region name:');
      if (!name) return;
      
      savedRegions.push({
        name: name,
        size: regionSize,
        rotation: {
          x: pivot.rotation.x,
          y: pivot.rotation.y,
          z: pivot.rotation.z
        },
        ...currentHighlight
      });
      
      console.log('Saved regions:', JSON.stringify(savedRegions, null, 2));
      alert(`Region "${name}" saved! Check console for data.`);
    });
    /* === END RAYCASTING & REGION HIGHLIGHTING === */

    /* === BRAND UV DATA === */
    const brandRegions = [
      {

      },
      {

        uv: { u: 0.5821000004871932, v: 0.32749540339190475 }
      },
      {

        uv: { u: 0.5353835784847331, v: 0.4964262682705122 }
      },
      {

        size: 0.5,
        rotation: { x: 0.67841, y: -2.12159, z: -0.88159 },

        normal: { x: 0.6713864359851258, y: -0.5550773222430553, z: -0.4910493049650615 },
        uv: { u: 0.34568008527805727, v: 0.5525434072147887 }
      },
      {
        name: "Adidas Originals",
        size: 0.5,
        rotation: { x: -0.41159, y: -2.41159, z: -0.88159 },

        uv: { u: 0.44161156397750917, v: 0.8733306741728485 }
      },
      {

        size: 0.5,
        rotation: { x: 0.42841, y: -0.23159, z: -0.81159 },
        point: { x: 0.08468309586029901, y: -0.0268162921530698, z: 1.1983540764536658 },
        normal: { x: -0.6361054435436103, y: -0.7230917467640352, z: -0.2692734492220191 },
        uv: { u: 0.9091621947946622, v: 0.41531542130613386 }
      }
    ];
    
    // Calculate optimal rotation from UV coordinates
    // For spherical UV mapping: U = longitude, V = latitude
    function calculateRotationFromUV(uv) {
      // Convert UV to spherical angles
      // U: 0->1 maps to full rotation around Y axis
      // V: 0->1 maps to top-to-bottom of sphere
      
      const longitude = (uv.u - 0.5) * 2 * Math.PI; // -π to π
      const latitude = (uv.v - 0.5) * Math.PI;      // -π/2 to π/2
      
      // To face this point toward camera (+Z), we rotate the ball
      // Negative because we're rotating the ball, not the camera
      return {
        x: -latitude,
        y: -longitude,
        z: 0
      };
    }
    
    // Find shortest rotation path considering current rotation
    function getShortestRotation(current, target) {
      const normalizeAngle = (angle) => {
        while (angle > Math.PI) angle -= 2 * Math.PI;
        while (angle < -Math.PI) angle += 2 * Math.PI;
        return angle;
      };
      
      return {
        x: current.x + normalizeAngle(target.x - current.x),
        y: current.y + normalizeAngle(target.y - current.y),
        z: current.z + normalizeAngle(target.z - current.z)
      };
    }
    /* === END BRAND UV DATA === */

    let isAnimatingToTarget = false;
    let targetRotation = null;

    function saveBrandPosition() {
      if (!pivot) return;
      const name = prompt('Enter brand name:');
      if (!name) return;

      brandRegions.push({
        name: name,
        size: 0.1,
        point: { x: 0, y: 0, z: 1 },
        normal: { x: 0, y: 0, z: 1 },
        uv: { u: 0, v: 0 },
        rotation: { x: pivot.rotation.x, y: pivot.rotation.y, z: pivot.rotation.z }
      });

      renderBrandList();
      console.log('Brand regions:', JSON.stringify(brandRegions, null, 2));
    }

    function animateToRotation(target) {
      autoRotate = false;
      if (resumeTimeout) {
        clearTimeout(resumeTimeout);
        resumeTimeout = null;
      }
      
      // Reset camera to default position for consistent brand views
      controls.reset();
      
      // Get shortest path rotation
      if (pivot) {
        const currentRot = { x: pivot.rotation.x, y: pivot.rotation.y, z: pivot.rotation.z };
        targetRotation = getShortestRotation(currentRot, target);
      } else {
        targetRotation = target;
      }
      isAnimatingToTarget = true;
    }
    
    function animateToBrand(brandIndex) {
      const brand = brandRegions[brandIndex];
      if (!brand || !pivot) return;
      
      // Use stored rotation if available, otherwise try UV calculation
      if (brand.rotation) {
        console.log(`Rotating to ${brand.name}:`, brand.rotation);
        animateToRotation(brand.rotation);
      } else {
        const optimalRot = calculateRotationFromUV(brand.uv);
        console.log(`Rotating to ${brand.name} (from UV):`, optimalRot);
        animateToRotation(optimalRot);
      }
    }

    function deleteBrand(index) {
      brandRegions.splice(index, 1);
      renderBrandList();
    }

    function renderBrandList() {
      const list = document.getElementById('brand-list');
      list.innerHTML = brandRegions.map((brand, i) => `
        <div class="brand-item">
          <button class="brand-btn" onclick="window.selectBrand(${i})">${brand.name}</button>
          <button class="brand-btn delete-btn" onclick="window.deleteBrand(${i})">X</button>
        </div>
      `).join('');
    }

    window.selectBrand = (index) => {
      animateToBrand(index);
    };
    window.deleteBrand = deleteBrand;

    document.getElementById('save-brand-btn').addEventListener('click', saveBrandPosition);
    renderBrandList();

    document.querySelectorAll('.brand-side-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const index = parseInt(btn.dataset.brand);
        animateToBrand(index);
      });
    });

    const sliderX = document.getElementById('slider-x');
    const sliderY = document.getElementById('slider-y');
    const sliderZ = document.getElementById('slider-z');
    const valueX = document.getElementById('value-x');
    const valueY = document.getElementById('value-y');
    const valueZ = document.getElementById('value-z');

    function toDegrees(rad) {
      return Math.round(rad * 180 / Math.PI) + '°';
    }

    function onSliderChange() {
      if (!pivot) return;
      autoRotate = false;
      isAnimatingToTarget = false;
      if (resumeTimeout) {
        clearTimeout(resumeTimeout);
        resumeTimeout = null;
      }
      pivot.rotation.x = parseFloat(sliderX.value);
      pivot.rotation.y = parseFloat(sliderY.value);
      pivot.rotation.z = parseFloat(sliderZ.value);
      valueX.textContent = toDegrees(pivot.rotation.x);
      valueY.textContent = toDegrees(pivot.rotation.y);
      valueZ.textContent = toDegrees(pivot.rotation.z);
    }

    function updateSliders() {
      if (!pivot) return;
      sliderX.value = pivot.rotation.x;
      sliderY.value = pivot.rotation.y;
      sliderZ.value = pivot.rotation.z;
      valueX.textContent = toDegrees(pivot.rotation.x);
      valueY.textContent = toDegrees(pivot.rotation.y);
      valueZ.textContent = toDegrees(pivot.rotation.z);
    }

    sliderX.addEventListener('input', onSliderChange);
    sliderY.addEventListener('input', onSliderChange);
    sliderZ.addEventListener('input', onSliderChange);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (pivot && isAnimatingToTarget && targetRotation) {
        const speed = 0.05;
        pivot.rotation.x += (targetRotation.x - pivot.rotation.x) * speed;
        pivot.rotation.y += (targetRotation.y - pivot.rotation.y) * speed;
        pivot.rotation.z += (targetRotation.z - pivot.rotation.z) * speed;

        const dx = Math.abs(targetRotation.x - pivot.rotation.x);
        const dy = Math.abs(targetRotation.y - pivot.rotation.y);
        const dz = Math.abs(targetRotation.z - pivot.rotation.z);
        if (dx < 0.001 && dy < 0.001 && dz < 0.001) {
          isAnimatingToTarget = false;
          targetRotation = null;
        }
      } else if (pivot && autoRotate) {
        pivot.rotation.x += 0.003;
        pivot.rotation.y += 0.007;
        pivot.rotation.z += 0.002;
      }

      updateSliders();
      renderer.render(scene, camera);
    }

    animate();
  </script>
